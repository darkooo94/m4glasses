<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — m4glasses</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans flex flex-col min-h-screen">

  <header class="sticky top-0 z-40 backdrop-blur-md bg-slate-900/80 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-white text-xl">m4</div>
        <span class="text-2xl font-black text-white">m4<span class="text-cyan-400">glasses</span></span>
      </a>
      <a href="cart.html" class="relative p-2 rounded-lg bg-slate-800 text-slate-200">
        <i data-lucide="shopping-bag" class="w-6 h-6"></i>
        <span id="cart-badge" class="absolute -top-1 -right-1 bg-cyan-500 text-slate-950 font-bold text-xs w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900 hidden">0</span>
      </a>
    </div>
  </header>

  <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
    <a href="shop.html" class="text-slate-400 hover:text-white text-sm flex items-center mb-6">
      <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Back to Catalog
    </a>

    <div id="product-detail-container" class="bg-slate-800/40 border border-slate-800 rounded-3xl p-6 sm:p-10">
      <!-- Injected by script.js -->
    </div>
  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    &copy; 2026 m4glasses. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
