<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Eyewear — m4glasses</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans flex flex-col min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-slate-900/80 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-white text-xl shadow-lg">m4</div>
        <span class="text-2xl font-black text-white">m4<span class="text-cyan-400">glasses</span></span>
      </a>

      <nav class="hidden md:flex space-x-8 text-sm font-medium">
        <a href="index.html" class="text-slate-300 hover:text-cyan-400 transition">Home</a>
        <a href="shop.html" class="text-cyan-400 font-semibold">Shop</a>
        <a href="about.html" class="text-slate-300 hover:text-cyan-400 transition">About Us</a>
      </nav>

      <div class="flex items-center space-x-4">
        <a href="cart.html" class="relative p-2 rounded-lg bg-slate-800 text-slate-200">
          <i data-lucide="shopping-bag" class="w-6 h-6"></i>
          <span id="cart-badge" class="absolute -top-1 -right-1 bg-cyan-500 text-slate-950 font-bold text-xs w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900 hidden">0</span>
        </a>
        <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg bg-slate-800 text-slate-200">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Shop Body -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
    <div class="mb-8">
      <h1 class="text-3xl font-black text-white mb-2">Eyewear Catalog</h1>
      <p class="text-slate-400 text-sm">Filter through our high-performance frames.</p>
    </div>

    <!-- Filter Bar -->
    <div class="flex flex-col md:flex-row gap-4 justify-between items-center bg-slate-800/40 p-4 rounded-2xl border border-slate-800 mb-8">
      <div class="relative w-full md:w-80">
        <i data-lucide="search" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="shop-search" placeholder="Search models..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
      </div>

      <div class="flex flex-wrap gap-2 w-full md:w-auto items-center justify-between">
        <div id="category-filters" class="flex space-x-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
          <!-- Filter buttons rendered by script.js -->
        </div>

        <select id="shop-sort" class="bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-cyan-500">
          <option value="featured">Featured</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="rating">Highest Rated</option>
        </select>
      </div>
    </div>

    <!-- Product Grid -->
    <div id="shop-product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    &copy; 2026 m4glasses. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
